openapi: "3.1.0"
info:
  title: Stats App API
  version: "0.1.0"
  description: API versionada para análisis estadístico de fútbol

servers:
  - url: /api/v1
    description: API v1

paths:
  /:
    get:
      operationId: getRoot
      summary: Información del servicio
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceInfo"

  /health/live:
    get:
      operationId: getLiveness
      summary: Liveness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness probe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessStatus"

  /matchdays/current:
    get:
      operationId: getCurrentMatchday
      summary: Jornada actual con partidos y cuotas Over/Under 2.5
      parameters:
        - name: matchday
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Matchday"

  /matches/{match_id}:
    get:
      operationId: getMatchDetail
      summary: Detalle de un partido con estadísticas y cuotas
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchDetail"
        "404":
          description: Partido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /matches/{match_id}/odds:
    get:
      operationId: getMatchOdds
      summary: Snapshots de cuotas de un partido
      parameters:
        - name: match_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Odds"
        "404":
          description: Partido no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /predictions/{prediction_id}:
    get:
      operationId: getPrediction
      summary: Recupera una predicción persistida por ID
      parameters:
        - name: prediction_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prediction"
        "404":
          description: Predicción no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /opportunities:
    get:
      operationId: getOpportunities
      summary: Scanner de oportunidades (señales con edge, EV, calidad y riesgo)
      parameters:
        - name: min_edge
          in: query
          required: false
          schema:
            type: number
            minimum: -100
            maximum: 100
            default: 0
        - name: risk
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: matchday
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [edge, ev, probability]
            default: edge
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Opportunity"

components:
  schemas:
    ServiceInfo:
      type: object
      required: [service, version, env]
      properties:
        service:
          type: string
          example: stats-api
        version:
          type: string
          example: "0.1.0"
        env:
          type: string
          example: development

    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]

    ReadinessStatus:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        checks:
          type: object
          properties:
            postgres:
              type: string
            redis:
              type: string

    Team:
      type: object
      required: [id, name, short_name]
      properties:
        id:
          type: string
        name:
          type: string
        short_name:
          type: string

    Match:
      type: object
      required: [id, competition, kickoff_at, home_team, away_team, status]
      properties:
        id:
          type: string
        competition:
          type: string
        kickoff_at:
          type: string
          format: date-time
        home_team:
          $ref: "#/components/schemas/Team"
        away_team:
          $ref: "#/components/schemas/Team"
        status:
          type: string
          enum: [scheduled, finished]
        over_odds:
          type: number
          nullable: true
        under_odds:
          type: number
          nullable: true

    Matchday:
      type: object
      required: [matchday, updated_at, total_matches, matches]
      properties:
        matchday:
          type: integer
        updated_at:
          type: string
          format: date-time
        total_matches:
          type: integer
        matches:
          type: array
          items:
            $ref: "#/components/schemas/Match"

    TeamMatchStats:
      type: object
      required: [match_id, team_id, goals]
      properties:
        match_id:
          type: string
        team_id:
          type: string
        goals:
          type: integer
        shots:
          type: integer
          nullable: true
        shots_on_target:
          type: integer
          nullable: true
        possession:
          type: number
          nullable: true
        corners:
          type: integer
          nullable: true

    Odds:
      type: object
      required: [match_id, market, selection, decimal_odds, captured_at, provider]
      properties:
        match_id:
          type: string
        market:
          type: string
          enum: [over_under_2_5]
        selection:
          type: string
          enum: [over, under]
        decimal_odds:
          type: number
        captured_at:
          type: string
          format: date-time
        provider:
          type: string

    MatchDetail:
      type: object
      required: [match, stats, odds]
      properties:
        match:
          $ref: "#/components/schemas/Match"
        stats:
          type: array
          items:
            $ref: "#/components/schemas/TeamMatchStats"
        odds:
          type: array
          items:
            $ref: "#/components/schemas/Odds"
        predictions:
          type: array
          items:
            $ref: "#/components/schemas/Prediction"

    Prediction:
      type: object
      required: [id, match_id, model_version_id, market, selection, probability, fair_odds, data_quality, risk_level, inputs_hash, prediction_timestamp]
      properties:
        id:
          type: string
          format: uuid
        match_id:
          type: string
          format: uuid
        model_version_id:
          type: string
          format: uuid
        market:
          type: string
        selection:
          type: string
        probability:
          type: number
        fair_odds:
          type: number
        implied_probability:
          type: number
          nullable: true
        no_vig_probability:
          type: number
          nullable: true
        edge_pp:
          type: number
          nullable: true
        ev:
          type: number
          nullable: true
        data_quality:
          type: string
        risk_level:
          type: string
        inputs:
          type: string
          nullable: true
        inputs_hash:
          type: string
        prediction_timestamp:
          type: string
          format: date-time

    Opportunity:
      type: object
      required: [match_id, home_team_short, away_team_short, kickoff_at, market, selection, model_probability, market_no_vig_probability, observed_odds, fair_odds, edge_pp, ev, data_quality, risk_level, is_signal, signal_exclusions, snapshot_age_minutes]
      properties:
        match_id:
          type: string
        home_team_short:
          type: string
        away_team_short:
          type: string
        kickoff_at:
          type: string
          format: date-time
        market:
          type: string
        selection:
          type: string
          enum: [over, under]
        model_probability:
          type: number
        market_no_vig_probability:
          type: number
        observed_odds:
          type: number
        fair_odds:
          type: number
        edge_pp:
          type: number
        ev:
          type: number
        data_quality:
          type: string
        risk_level:
          type: string
        is_signal:
          type: boolean
        signal_exclusions:
          type: array
          items:
            type: string
        snapshot_age_minutes:
          type: integer

    ErrorResponse:
      type: object
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
        correlation_id:
          type: string
