[project]
name = "stats-worker"
version = "0.1.0"
description = "Stats App async worker"
requires-python = ">=3.12"
dependencies = [
    "redis>=5",
    "pydantic>=2",
    "pydantic-settings>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
